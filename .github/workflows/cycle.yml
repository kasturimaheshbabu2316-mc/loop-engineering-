name: EdgeDash Scheduled Cycle

on:
  # Scheduled trigger: Run daily at 06:00 IST (UTC+05:30)
  # 00:30 UTC = 06:00 IST
  schedule:
    - cron: '30 0 * * *'

  # Manual trigger for immediate execution and testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle:
    name: Run EdgeDash Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Hard job timeout per rule 51

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: python -m edgedash.storage --migrate

      - name: Execute EdgeDash cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: python run_cycle.py 2>&1 | tee cycle.log

      - name: Upload cycle log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-log
          path: cycle.log
          retention-days: 30
          if-no-files-found: warn

      - name: Run system health check
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: python -m edgedash.health

